name: Python Test Suite

# Trigger this workflow on push, pull requests, AND on a daily schedule
on:
  push:
  pull_request:
  schedule:
    # The cron syntax '0 0 * * *' means: 
    # Minute: 0, Hour: 0 (midnight UTC), Day: *, Month: *, Day of week: *
    # This runs the workflow automatically once every day at midnight UTC.
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest   # Virtual machine environment used to run the job

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run Pytest test suite
        run: pytest -v